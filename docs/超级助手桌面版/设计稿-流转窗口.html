<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超级助手流转窗口设计稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* 布局：左边是真终端（和调度员聊天），右边是竖排的流转面板，顶部标签页切换 流程 / 交接 / 卡片 */
  --night: #0b1220;
  --panel: #101a2b;
  --term: #0a0f18;
  --rail: #26364f;
  --text: #e8eef6;
  --dim: #8796ad;
  --signal: #f5b451;
  --done: #6fcf9e;
  --stop: #f07167;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --row: 68px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(1200px 600px at 50% -10%, #17263f 0%, var(--night) 60%) fixed, var(--night);
  color: var(--text); font: 14px/1.6 var(--font-body); display: grid; place-items: center; padding: 24px 16px;
}
.window { width: min(1280px, 100%); height: min(780px, calc(100vh - 48px)); min-height: 600px; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--panel); border: 1px solid #1f2d44; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .7); }
.titlebar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #1c2940; }
.lights { display: flex; gap: 7px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; background: #3a475c; }
.titlebar .name { flex: 1; text-align: center; color: var(--dim); font-size: 13px; letter-spacing: .08em; }
.titlebar .demo { font-size: 11px; color: var(--dim); border: 1px solid var(--rail); border-radius: 999px; padding: 1px 9px; }
.body { display: grid; grid-template-columns: minmax(320px, var(--left, 1.55fr)) 7px minmax(360px, 1fr); min-height: 0; }
/* 中间分隔条：拖动调整左右宽度，双击恢复默认 */
.divider { cursor: col-resize; background: #1c2940; position: relative; touch-action: none; }
.divider::after { content: ""; position: absolute; left: 2px; top: 50%; width: 3px; height: 36px; margin-top: -18px; border-radius: 2px; background: #3a4a63; }
.divider:hover, .divider.drag, .divider:focus-visible { background: var(--signal); outline: none; }
.divider:hover::after, .divider.drag::after { background: var(--night); }

/* 左：终端 */
.term { background: var(--term); font: 13px/1.65 var(--font-num); color: #c9d4e3; padding: 16px 20px 12px; display: flex; flex-direction: column; min-height: 0; }
.term-tag { font-family: var(--font-body); font-size: 11px; color: var(--dim); margin-bottom: 10px; }
.term-out { flex: 1; overflow-y: auto; min-height: 0; white-space: pre-wrap; }
.term-out .u { color: var(--text); }
.term-out .u::before { content: "> "; color: var(--dim); }
.term-out .c::before { content: "● "; color: var(--text); }
.term-out .tool { color: var(--dim); }
.term-out .tool b { color: #9cc3ff; font-weight: 400; }
.term-out .res { color: var(--dim); padding-left: 2ch; }
.term-out .ok { color: var(--done); }
.term-out .gap { height: .8em; }
.term-out .new { animation: arrive 1.2s ease-out; }
.prompt { border-top: 1px solid #1c2940; margin-top: 10px; padding-top: 8px; color: var(--text); }
.prompt .cur { display: inline-block; width: .6em; height: 1.1em; background: var(--text); vertical-align: -2px; animation: beat 1.1s steps(1) infinite; }
.hint { color: #56657c; font-size: 12px; margin-top: 4px; }

/* 右：流转面板 */
.side { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; }
.side-head { padding: 16px 20px 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: end; }
.project { color: var(--dim); font-size: 12px; grid-column: 1 / -1; }
h1 { margin: 0; font-size: 18px; font-weight: 500; line-height: 1.35; text-wrap: balance; }
.clock { text-align: right; grid-row: 2 / span 2; grid-column: 2; }
.clock .big { font: 500 28px/1 var(--font-num); font-variant-numeric: tabular-nums; }
.clock .small { color: var(--dim); font-size: 12px; margin-top: 4px; white-space: nowrap; }
.now { font-size: 14px; color: var(--signal); display: flex; align-items: center; gap: 8px; }
.now::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: beat 1.4s ease-in-out infinite; flex: none; }
.now.ok { color: var(--done); }
.now.bad { color: var(--stop); }

.tabs { display: flex; gap: 4px; padding: 6px 16px 0; border-bottom: 1px solid #1c2940; }
.tab { font: inherit; font-size: 13px; background: none; border: 0; color: var(--dim); padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--signal); }
.tab .n { font-family: var(--font-num); font-size: 11px; color: var(--dim); margin-left: 4px; }
.tab:focus-visible, .row button:focus-visible, .list button:focus-visible, .btn:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.pane { overflow-y: auto; min-height: 0; padding: 14px 16px 18px; }
.pane[hidden] { display: none; }

/* 流程：竖排线路 */
.vflow { position: relative; }
.vline, .vlit, .vback { position: absolute; left: 36px; width: 4px; border-radius: 2px; top: calc(var(--row) / 2); }
.vline { height: calc(var(--row) * 6); background: var(--rail); }
.vlit { height: 0; background: var(--done); }
.vback { top: calc(var(--row) * 3.5); height: var(--row); background: repeating-linear-gradient(0deg, var(--stop) 0 9px, transparent 9px 16px); opacity: 0; }
.vback.on { opacity: 1; animation: up .6s linear infinite; }
.vtoken { position: absolute; left: 32px; width: 12px; height: 12px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 12px var(--signal); opacity: 0; transform: translateY(-50%); z-index: 3; }
.vtoken.on { opacity: 1; }
.vtoken.red { background: var(--stop); box-shadow: 0 0 12px var(--stop); }
.row { position: relative; height: var(--row); display: grid; grid-template-columns: 56px minmax(0, 1fr); align-items: center; gap: 10px; padding: 0 10px 0 17px; border-radius: 10px; border: 1px solid transparent; z-index: 2; }
.row button.face { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--rail); background: #15233a; color: var(--dim); font: 500 13px var(--font-body); cursor: pointer; position: relative; }
.row .t1 { font-size: 14px; color: var(--dim); }
.row .t1 b { font-weight: 500; color: var(--text); margin-right: 6px; }
.row .t2 { font-size: 12px; color: #6a7a92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.row .t2 i { display: none; }
.row.live .t2 i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--done); margin-right: 5px; vertical-align: 1px; animation: beat 1.2s ease-in-out infinite; }
.row.done button.face { border-color: var(--done); color: var(--text); }
.row.done button.face::after { content: "✓"; position: absolute; right: -5px; bottom: -3px; width: 16px; height: 16px; border-radius: 50%; background: var(--done); color: var(--night); font-size: 10px; line-height: 16px; font-weight: 700; }
.row.active { background: rgba(245, 180, 81, .07); border-color: rgba(245, 180, 81, .55); }
.row.active button.face { border-color: var(--signal); color: var(--text); animation: glow 1.8s ease-in-out infinite; }
.row.active .t2 { color: var(--text); }
.row.fail button.face { border-color: var(--stop); color: var(--stop); }
.row.fail .t2 { color: var(--stop); }
.row.wait { background: rgba(111, 207, 158, .08); border-color: rgba(111, 207, 158, .55); }
.row.wait button.face { background: var(--done); border-color: var(--done); color: var(--night); }
.row.wait .t2 { color: var(--done); }
.row.ok-note .t2 { color: var(--done); }
.row.bad-note { background: rgba(240, 113, 103, .07); border-color: rgba(240, 113, 103, .5); }
.row.bad-note button.face { border-color: var(--stop); color: var(--stop); }
.row.bad-note .t2 { color: var(--stop); }
.flow-foot { margin-top: 14px; font-size: 12px; color: var(--dim); }

/* 交接 */
.filter { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); margin-bottom: 8px; min-height: 28px; }
.btn { font: inherit; font-size: 12px; background: transparent; color: var(--text); border: 1px solid var(--rail); border-radius: 7px; padding: 3px 10px; cursor: pointer; }
.list { list-style: none; margin: 0; padding: 0; }
.list li button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.list li button:hover { background: #15233a; }
.list .m { font-size: 12px; color: var(--dim); }
.list .m span { font-family: var(--font-num); font-size: 11px; margin-right: 8px; }
.list .s { font-size: 14px; }
.list .s.bad { color: var(--stop); }
.list .s.ok { color: var(--done); }
.list pre { white-space: pre-wrap; font: 13px/1.6 var(--font-body); color: #c7d2e2; background: #15233a; border-radius: 8px; padding: 10px 12px; margin: 6px 0 0; }

/* 卡片 */
.cards { display: grid; gap: 10px; }
.cardi { border: 1px solid #1f2d44; border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; }
.cardi .id { font-family: var(--font-num); font-size: 11px; color: var(--dim); }
.cardi .nm { font-size: 14px; }
.cardi .st { font-size: 12px; color: var(--dim); grid-column: 1; }
.cardi .st.run { color: var(--signal); }
.cardi .st.fin { color: var(--done); }
.cardi .btn { grid-row: 1 / span 3; grid-column: 2; }
.cardi.current { border-color: rgba(245, 180, 81, .5); }

@keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 4px rgba(245, 180, 81, .12), 0 0 16px rgba(245, 180, 81, .35); } 50% { box-shadow: 0 0 0 8px rgba(245, 180, 81, .05), 0 0 26px rgba(245, 180, 81, .6); } }
@keyframes up { to { background-position: 0 -16px; } }
@keyframes arrive { from { background: rgba(245, 180, 81, .18); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 820px) {
  .window { height: auto; }
  .body { grid-template-columns: 1fr; }
  .divider { display: none; }
  .term { height: 360px; border-bottom: 1px solid #1c2940; }
  .side { min-height: 640px; }
}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="name">超级助手 · 视频提取文字</span>
    <span class="demo">设计稿 · 模拟数据 · 10 倍速</span>
  </div>

  <div class="body">
    <section class="term" aria-label="终端">
      <div class="term-tag">你和调度员（现在是 Claude）的对话，和现在的终端一模一样，全程记录都在，往上翻就能看。这里是示意。</div>
      <div class="term-out" id="termOut"></div>
      <div class="prompt">&gt; <span class="cur"></span></div>
      <div class="hint">接着上一次的对话 · esc 打断</div>
    </section>

    <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="拖动调整左右宽度，双击恢复" tabindex="0" title="拖动调整左右宽度，双击恢复"></div>

    <section class="side" aria-label="流转面板">
      <div class="side-head">
        <div class="project">CARD-003</div>
        <h1>粘贴链接后显示处理进度</h1>
        <div class="clock"><div class="big" id="elapsed">0:00</div><div class="small" id="round">第 1 轮 · 返工 0 次</div></div>
        <div class="now" id="now" role="status" aria-live="polite"></div>
      </div>

      <div class="tabs" role="tablist" aria-label="面板">
        <button class="tab" role="tab" id="tab-flow" aria-selected="true" aria-controls="pane-flow" type="button">流程</button>
        <button class="tab" role="tab" id="tab-log" aria-selected="false" aria-controls="pane-log" type="button">交接<span class="n" id="count">0</span></button>
        <button class="tab" role="tab" id="tab-cards" aria-selected="false" aria-controls="pane-cards" type="button">卡片<span class="n">3</span></button>
      </div>

      <div class="pane" id="pane-flow" role="tabpanel" aria-labelledby="tab-flow">
        <div class="vflow" id="vflow">
          <div class="vline"></div><div class="vlit" id="vlit"></div><div class="vback" id="vback"></div><div class="vtoken" id="vtoken"></div>
        </div>
        <div class="flow-foot">点头像，看这个人的全部交接。</div>
      </div>

      <div class="pane" id="pane-log" role="tabpanel" aria-labelledby="tab-log" hidden>
        <div class="filter" id="filter"></div>
        <ol class="list" id="list"></ol>
      </div>

      <div class="pane" id="pane-cards" role="tabpanel" aria-labelledby="tab-cards" hidden>
        <div class="cards">
          <div class="cardi current"><span class="id">CARD-003</span><span class="nm">粘贴链接后显示处理进度</span><span class="st run" id="cardState">进行中</span><button class="btn" type="button" id="replay">从头回放</button></div>
          <div class="cardi"><span class="id">CARD-002</span><span class="nm">修复类型检查报错</span><span class="st fin">已合并 · 6 分钟 · 返工 0 次</span><button class="btn" type="button" disabled title="设计稿只演示 CARD-003">回放</button></div>
          <div class="cardi"><span class="id">CARD-001</span><span class="nm">提示文案统一</span><span class="st fin">已合并 · 9 分钟 · 返工 1 次</span><button class="btn" type="button" disabled title="设计稿只演示 CARD-003">回放</button></div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";
  var SPEED = 10, START = 20 * 3600 + 41 * 60, LOAD_AT = 220;
  var ROW = 68;
  var RULES = "开工前先读规则：collab/规则.md。";
  var CARD = ".collab/cards/CARD-003/需求卡.md";
  var P = { test: [0, 185], dev1: [190, 260], check1: [260, 300], dev2: [305, 400], check2: [400, 430], review: [440, 500], wait: 505 };

  var stations = [
    { id: "you", face: "你", who: "你", step: "提需求" },
    { id: "disp", face: "Cl", who: "Claude", step: "调度" },
    { id: "test", face: "Cx", who: "Codex", step: "写测试" },
    { id: "dev", face: "Cu", who: "Cursor", step: "写代码" },
    { id: "check", face: "检", who: "程序", step: "跑测试" },
    { id: "rev", face: "ag", who: "agy", step: "复查" },
    { id: "accept", face: "你", who: "你", step: "验收" }
  ];

  var events = [
    { t: -600, from: "你", to: "Claude", sum: "粘贴链接后要显示处理进度", full: "你在聊天里说：视频链接粘贴后，等两分多钟什么都看不到，不知道是不是卡死了。希望点了之后能一直告诉我现在在干嘛。" },
    { t: -180, from: "Claude", to: "你", sum: "方案写好了，你回复“同意”", full: "方案：页面依次显示 4 个阶段：获取视频信息、下载音频、语音识别中、整理文字；每个阶段显示已用时间；超过 2 分钟没进展时提示“还在处理，长视频会久一些”。\n允许改动：提取页面和进度组件。\n你回复：同意。" },
    { t: 0, from: "Claude", to: "Codex", sum: "按验收标准先写测试", full: RULES + "按任务卡 " + CARD + " 的验收标准编写自动化测试，放进项目的测试目录。只写测试，不改产品代码。" },
    { t: 185, from: "Codex", to: "Claude", sum: "写好 22 条测试，覆盖 4 个阶段", full: "新增测试文件 progress-steps.test.tsx，共 22 条。\n覆盖：4 个阶段按顺序出现；每个阶段显示已用时间；超过 2 分钟显示提示；出错时显示原因。\n现在全部没过（功能还没写），这是正常的。" },
    { t: 190, from: "Claude", to: "Cursor", sum: "按测试写代码，让测试全部通过", full: RULES + "按任务卡实现功能：" + CARD + "。测试已经写好，请让它们全部通过。完成后，在回复的最后一行写“汇报：”加不超过100字的说明（改了什么、测试情况）。不要另建汇报文件。" },
    { t: 260, from: "Cursor", to: "Claude", sum: "汇报：新增进度步骤，接进了提取页", full: "汇报：新增进度步骤组件，接入提取页面，4 个阶段和计时都有了。测试我这边跑不了（这家工具在自动模式下不能执行命令），交给程序判定。" },
    { t: 300, from: "程序", to: "Cursor", cls: "bad", sum: "测试没过：22 条里 2 条，阶段名对不上", full: "改动范围正常（3 个文件，都在允许范围内）。\n\n第 1 轮判定　结论：没过\n22 条里 20 条通过，2 条没过：\n· 期望显示“语音识别中”，页面显示的是“上传并识别”\n· 期望显示“整理文字”，页面显示的是“生成文字稿”" },
    { t: 305, from: "Claude", to: "Cursor", sum: "退回修改（第 1 次返工）", full: RULES + "上一版测试没过，测试输出如下，请修复后重新提交。\n\n（附上一条的测试输出）\n\n任务卡：" + CARD + "。完成后在最后一行写“汇报：”。" },
    { t: 400, from: "Cursor", to: "Claude", sum: "汇报：两个阶段名改成和设计稿一致", full: "汇报：把“上传并识别”改成“语音识别中”，“生成文字稿”改成“整理文字”，和设计稿一致。" },
    { t: 430, from: "程序", to: "Claude", cls: "ok", sum: "测试全部通过（22/22）", full: "第 2 轮判定　结论：过\n22 条全部通过。改动仍在允许范围内。" },
    { t: 440, from: "Claude", to: "agy", sum: "只读复查：对照需求检查改动", full: RULES + "只读复查：对照任务卡 " + CARD + " 检查本次改动是否符合需求和验收标准。第一行写“结论：通过”或“结论：不通过”，之后列出问题。不要修改任何文件。" },
    { t: 500, from: "agy", to: "Claude", cls: "ok", sum: "结论：通过", full: "结论：通过\n· 4 个阶段的文字和顺序与需求一致\n· 只改了允许范围内的 3 个文件\n· 建议（不影响通过）：超过 2 分钟的提示可以再显眼一点" },
    { t: 505, from: "Claude", to: "你", sum: "做完了，等你验收", full: "测试 22 条全过，复查通过，返工 1 次，共用约 8 分钟。\n请打开页面，粘贴一个视频链接看看进度显示；你说“同意合并”我再合并。" }
  ];

  // 左边终端的示意内容：[出现时间, 样式, 文字]
  var term = [
    [-700, "u", "用协作包做这个需求：粘贴链接后要显示处理进度。现在等两分多钟什么都看不到。"],
    [-690, "gap", ""],
    [-680, "c", "先读项目说明和台账。"],
    [-670, "tool", "<b>Read</b>(docs/开发进度跟踪.md)"],
    [-200, "c", "方案写好了：页面依次显示 4 个阶段（获取视频信息、下载音频、语音识别中、整理文字），每个阶段显示已用时间，超过 2 分钟没进展时提示“长视频会久一些”。只改提取页面和进度组件。你同意我就开工。"],
    [-190, "gap", ""],
    [-30, "u", "同意"],
    [-25, "gap", ""],
    [-20, "tool", "<b>Bash</b>(python3 collab approve . CARD-003)"],
    [-18, "res", "⎿  CARD-003 方案已确认，可以开工"],
    [-5, "tool", "<b>Bash</b>(python3 collab run . CARD-003 --test-command \"npm test\")"],
    [-3, "res", "⎿  施工中……"],
    [2, "c", "已派出：Codex 先写测试，Cursor 写代码，agy 复查。进度看右边，有人卡住或没过三轮我会叫你。"],
    [506, "res", "⎿  CARD-003 最终状态：待验收（返工 1 次）"],
    [508, "c", "<span class=\"ok\">做完了</span>：22 条测试全过，复查通过，返工 1 次，用时约 8 分钟。请打开页面粘贴一个视频链接看看；你说“同意合并”我再合并。"]
  ];

  var codexLines = [[0, "正在读需求卡"], [40, "查看现有测试的写法"], [70, "新建测试文件"], [100, "写第 9 条：下载音频在获取信息之后"], [130, "写第 16 条：超过 2 分钟显示提示"], [160, "写第 22 条：出错时显示原因"], [178, "跑一遍：22 条都没过（正常，功能还没写）"]];
  var devFiles = [[0, "ProgressSteps.tsx"], [30, "progress.ts"], [55, "提取页 page.tsx"], [80, "ProgressSteps.tsx"]];
  var trips = [[1, 2, 0, 12], [2, 3, 185, 192], [3, 4, 260, 268], [4, 3, 300, 305], [3, 4, 400, 408], [4, 5, 430, 440], [5, 6, 500, 507]];

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function clock(t) { var x = START + Math.round(t); return pad(Math.floor(x / 3600) % 24) + ":" + pad(Math.floor(x / 60) % 60) + ":" + pad(x % 60); }
  function mmss(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ":" + pad(sec % 60); }
  function within(s, r) { return s >= r[0] && s < r[1]; }
  function lastBefore(list, v) { var hit = list[0]; list.forEach(function (x) { if (x[0] <= v) hit = x; }); return hit[1]; }
  function beat(s, start) { return Math.round(Math.max(0, s - start) % 17); }

  function phase(s) {
    if (within(s, P.test)) return "test";
    if (s >= P.test[1] && s < P.dev1[0]) return "toDev";
    if (within(s, P.dev1)) return "dev1";
    if (within(s, P.check1)) return "check1";
    if (s >= P.check1[1] && s < P.dev2[0]) return "bounce";
    if (within(s, P.dev2)) return "dev2";
    if (within(s, P.check2)) return "check2";
    if (s >= P.check2[1] && s < P.review[0]) return "passed";
    if (within(s, P.review)) return "review";
    if (s >= P.review[1] && s < P.wait) return "reviewed";
    return "wait";
  }

  function states(s) {
    var ph = phase(s);
    var st = { you: "done", disp: "done", test: s < P.test[1] ? "active" : "done", dev: "idle", check: "idle", rev: "idle", accept: "idle" };
    if (s >= P.dev1[0]) st.dev = (ph === "dev1" || ph === "dev2" || ph === "bounce") ? "active" : "done";
    if (ph === "check1" || ph === "check2") st.check = "active";
    else if (ph === "bounce") st.check = "bad-note";
    else if (ph === "dev2") st.check = "fail";
    else if (ph === "passed") st.check = "done ok-note";
    else if (s >= P.check2[1]) st.check = "done";
    if (ph === "review") st.rev = "active"; else if (ph === "reviewed") st.rev = "done ok-note"; else if (s >= P.review[1]) st.rev = "done";
    if (ph === "wait") st.accept = "wait";
    return st;
  }

  // 每一站的第二行：正在干的写此刻在干嘛，干完的写结果和用时
  function detail(id, s) {
    var ph = phase(s), live = function (start) { return "已干 " + mmss(s - start) + " · " + beat(s, start) + " 秒前有动静"; };
    switch (id) {
      case "you": return "已批准方案";
      case "disp": return ph === "wait" ? "已向你汇报" : "派活后盯进度，有人卡住会叫你";
      case "test": return ph === "test" ? lastBefore(codexLines, s) + " · " + live(0) : "写好 22 条测试 · 用了 " + mmss(P.test[1] - P.test[0]);
      case "dev":
        if (s < P.dev1[0]) return "等测试写完";
        if (ph === "dev1") return "在改 " + lastBefore(devFiles, s - P.dev1[0]) + " · " + live(P.dev1[0]);
        if (ph === "bounce") return "收到退回：2 条测试没过";
        if (ph === "dev2") return "返工：在改 " + lastBefore(devFiles, s - P.dev2[0]) + " · " + live(P.dev2[0]);
        if (s < P.dev2[0]) return "写完了，交给程序检查";
        return "两轮写完 · 返工 1 次";
      case "check":
        if (ph === "check1" || ph === "check2") return "核对改动范围、跑测试…";
        if (ph === "bounce" || ph === "dev2") return "第 1 轮没过：2 条，退回写代码";
        if (s >= P.check2[1]) return "22 条全部通过";
        return "等代码写完";
      case "rev":
        if (ph === "review") return "对照需求检查改动（只看不改） · " + live(P.review[0]);
        if (s >= P.review[1]) return "结论：通过 · 用了 " + mmss(P.review[1] - P.review[0]);
        return "等测试通过";
      default: return ph === "wait" ? "做完了，等你验收" : "等全部做完";
    }
  }

  function nowText(s) {
    return {
      test: ["测试员 Codex 正在写测试", ""], toDev: ["测试写好了，交给开发员", "ok"],
      dev1: ["开发员 Cursor 正在写代码", ""], check1: ["程序正在跑测试", ""],
      bounce: ["测试没过，退回开发员", "bad"], dev2: ["开发员 Cursor 正在返工", ""],
      check2: ["程序正在重新跑测试", ""], passed: ["测试全部通过", "ok"],
      review: ["复查员 agy 正在复查", ""], reviewed: ["复查通过", "ok"],
      wait: ["做完了，等你验收", "ok"]
    }[phase(s)];
  }

  // 只在内容变化时改页面，免得闪烁的小圆点每帧被重画而停住
  var cache = {};
  function put(key, el, value, asText) {
    if (cache[key] === value) return;
    cache[key] = value;
    if (asText) el.textContent = value; else el.innerHTML = value;
  }

  // 搭流程行
  var vflow = document.getElementById("vflow");
  stations.forEach(function (x) {
    var row = document.createElement("div");
    row.className = "row"; row.id = "row-" + x.id;
    row.innerHTML = '<button class="face" type="button" aria-label="看 ' + x.who + ' 的交接">' + x.face + "</button>" +
      '<div><div class="t1"><b>' + x.who + "</b>" + x.step + '</div><div class="t2"><i></i><span></span></div></div>';
    row.querySelector("button").addEventListener("click", function () { showLog(x.who === "程序" ? null : x.who); });
    vflow.appendChild(row);
  });

  var vlit = document.getElementById("vlit"), vback = document.getElementById("vback"), vtoken = document.getElementById("vtoken");
  var termOut = document.getElementById("termOut"), termShown = 0;
  var current = LOAD_AT;

  function frame(s) {
    current = s;
    var st = states(s), ph = phase(s);
    stations.forEach(function (x) {
      var row = document.getElementById("row-" + x.id);
      // 正在干活（不含程序跑测试）的那一行带一个闪烁的“有动静”小圆点
      var live = st[x.id] === "active" && x.id !== "check" && phase(s) !== "bounce";
      var cls = "row " + st[x.id] + (live ? " live" : "");
      if (row.className !== cls) row.className = cls;
      put("d-" + x.id, row.querySelector(".t2 span"), detail(x.id, s), true);
    });

    var reach = 0;
    stations.forEach(function (x, i) { if (st[x.id] !== "idle") reach = i; });
    var trip = trips.filter(function (t) { return s >= t[2] && s < t[3]; })[0];
    var tokenCls = "vtoken";
    if (trip) {
      var pos = trip[0] + (trip[1] - trip[0]) * (s - trip[2]) / (trip[3] - trip[2]);
      vtoken.style.top = (ROW / 2 + pos * ROW) + "px";
      tokenCls += " on" + (trip[1] < trip[0] ? " red" : "");
      if (trip[1] > trip[0]) reach = Math.max(trip[0], Math.min(reach, pos));
    }
    vtoken.className = tokenCls;
    vlit.style.height = (reach * ROW) + "px";
    var back = ph === "bounce" || ph === "dev2";
    var backCls = "vback" + (back ? " on" : "");
    if (vback.className !== backCls) vback.className = backCls;

    var nt = nowText(s), nowEl = document.getElementById("now");
    put("now", nowEl, nt[0], true);
    if (nowEl.className !== "now " + nt[1]) nowEl.className = "now " + nt[1];
    put("elapsed", document.getElementById("elapsed"), mmss(Math.min(s, P.wait)), true);
    var reworked = s >= P.check1[1];
    put("round", document.getElementById("round"), "第 " + (reworked ? 2 : 1) + " 轮 · 返工 " + (reworked ? 1 : 0) + " 次", true);
    put("cardState", document.getElementById("cardState"), ph === "wait" ? "等你验收" : "进行中", true);

    var seen = events.filter(function (e) { return e.t <= s; }).length;
    put("count", document.getElementById("count"), String(seen), true);
    if (!document.getElementById("pane-log").hidden && seen !== drawnCount) drawList();

    var lines = term.filter(function (l) { return l[0] <= s; });
    if (lines.length < termShown) { termOut.innerHTML = ""; termShown = 0; }
    for (var i = termShown; i < lines.length; i++) {
      var d = document.createElement("div");
      d.className = lines[i][1] + (termShown > 0 ? " new" : "");
      d.innerHTML = lines[i][2];
      termOut.appendChild(d);
    }
    if (lines.length !== termShown) termOut.scrollTop = termOut.scrollHeight;
    termShown = lines.length;
  }

  // 标签页
  var tabs = ["flow", "log", "cards"];
  function select(name) {
    tabs.forEach(function (t) {
      document.getElementById("tab-" + t).setAttribute("aria-selected", String(t === name));
      document.getElementById("pane-" + t).hidden = t !== name;
    });
  }
  tabs.forEach(function (t) {
    document.getElementById("tab-" + t).addEventListener("click", function () { if (t === "log") showLog(null); else select(t); });
  });

  // 交接列表
  var list = document.getElementById("list"), filterWho = null, opened = {}, drawnCount = -1;
  function drawList() {
    var seen = events.filter(function (e) { return e.t <= current; });
    drawnCount = seen.length;
    document.getElementById("filter").innerHTML = filterWho
      ? "只看 " + filterWho + ' <button class="btn" type="button" id="clearFilter">看全部</button>'
      : "全部交接，最新的在最下面；点一条看全文";
    var c = document.getElementById("clearFilter");
    if (c) c.addEventListener("click", function () { showLog(null); });
    list.innerHTML = seen.map(function (e, i) { return [e, i]; })
      .filter(function (p) { return !filterWho || p[0].from === filterWho || p[0].to === filterWho; })
      .map(function (p) {
        var e = p[0], i = p[1];
        return '<li><button type="button" data-i="' + i + '" aria-expanded="' + (!!opened[i]) + '">' +
          '<div class="m"><span>' + clock(e.t) + "</span>" + e.from + " → " + e.to + "</div>" +
          '<div class="s ' + (e.cls || "") + '">' + e.sum + "</div>" + (opened[i] ? "<pre>" + e.full + "</pre>" : "") + "</button></li>";
      }).join("");
    var pane = document.getElementById("pane-log"); pane.scrollTop = pane.scrollHeight;
  }
  list.addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-i]"); if (!b) return;
    var i = b.getAttribute("data-i"); opened[i] = !opened[i]; drawList();
    var again = list.querySelector('button[data-i="' + i + '"]'); if (again) again.focus();
  });
  function showLog(who) { filterWho = who; select("log"); drawList(); }

  // 拖动分隔条调整左右宽度；记住上次的宽度，双击恢复默认
  var bodyEl = document.querySelector(".body"), divider = document.getElementById("divider");
  function setLeft(px) {
    var total = bodyEl.getBoundingClientRect().width;
    px = Math.max(320, Math.min(total - 367, px));
    bodyEl.style.setProperty("--left", px + "px");
    try { localStorage.setItem("sa-left", String(px)); } catch (e) { /* 存不了就算了 */ }
  }
  try { var saved = Number(localStorage.getItem("sa-left")); if (saved) setLeft(saved); } catch (e) { /* 忽略 */ }
  divider.addEventListener("pointerdown", function (ev) {
    divider.setPointerCapture(ev.pointerId); divider.classList.add("drag");
    var left = bodyEl.getBoundingClientRect().left;
    function move(e) { setLeft(e.clientX - left); }
    function up() { divider.classList.remove("drag"); divider.removeEventListener("pointermove", move); divider.removeEventListener("pointerup", up); }
    divider.addEventListener("pointermove", move); divider.addEventListener("pointerup", up);
  });
  divider.addEventListener("dblclick", function () {
    bodyEl.style.removeProperty("--left");
    try { localStorage.removeItem("sa-left"); } catch (e) { /* 忽略 */ }
  });
  divider.addEventListener("keydown", function (ev) {
    if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
    ev.preventDefault();
    var cur = document.querySelector(".term").getBoundingClientRect().width;
    setLeft(cur + (ev.key === "ArrowRight" ? 24 : -24));
  });

  // 播放
  var t0 = performance.now(), from = LOAD_AT, running = true;
  function loop(now) {
    if (!running) return;
    var s = from + (now - t0) / 1000 * SPEED;
    if (s >= P.wait + 8) { s = P.wait + 8; running = false; }
    frame(s);
    if (running) requestAnimationFrame(loop);
  }
  document.getElementById("replay").addEventListener("click", function () {
    from = 0; t0 = performance.now(); opened = {}; select("flow");
    if (!running) { running = true; requestAnimationFrame(loop); }
  });
  frame(LOAD_AT);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
