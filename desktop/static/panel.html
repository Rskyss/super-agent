<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超级助手 · 流转</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/panel.css">
</head>
<body>
<main class="side" id="side" aria-label="卡片详情">
  <div class="actions" id="actions" hidden>
    <div class="phase-hint" id="phaseHint"></div>
    <div class="action-btns" id="actionBtns"></div>
    <div id="reviseBox" hidden>
      <textarea id="reviseText" rows="3" placeholder="还要改什么"></textarea>
      <button type="button" id="reviseSend">提交修改</button>
    </div>
  </div>
  <section class="plan-preview" id="planSection" hidden>
    <div class="plan-block"><h2 class="plan-h">方案</h2><pre id="planText"></pre></div>
    <div class="plan-block"><h2 class="plan-h">允许改动的文件</h2><pre id="planAllowed"></pre></div>
    <div class="plan-block"><h2 class="plan-h">测试命令</h2><pre id="planTest"></pre></div>
    <div class="plan-block" id="profileBlock" hidden><h2 class="plan-h">项目说明（草稿）</h2><pre id="planProfile"></pre></div>
  </section>
  <nav class="seg" role="tablist" aria-label="卡片内容">
    <button class="tab" role="tab" id="tab-flow" aria-selected="true" aria-controls="pane-flow" type="button">流程</button>
    <button class="tab" role="tab" id="tab-log" aria-selected="false" aria-controls="pane-log" type="button">交接<span class="n" id="count">0</span></button>
  </nav>

  <section class="pane" id="pane-flow" role="tabpanel" aria-labelledby="tab-flow">
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="pane" id="pane-log" role="tabpanel" aria-labelledby="tab-log" hidden>
    <div class="filter" id="filter"></div>
    <ol class="list" id="list"></ol>
  </section>

  <div class="blank" id="blank" hidden></div>
  <div class="offline" id="offline" hidden>和数据服务断开了，正在重连…</div>
</main>
<script src="/static/panel.js"></script>
</body>
</html>
