<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超级助手 · 流转</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/panel.css">
</head>
<body>
<main class="side" id="side" aria-label="卡片详情">
  <nav class="seg" role="tablist" aria-label="卡片内容">
    <button class="tab" role="tab" id="tab-flow" aria-selected="true" aria-controls="pane-flow" type="button">流程</button>
    <button class="tab" role="tab" id="tab-log" aria-selected="false" aria-controls="pane-log" type="button">交接<span class="n" id="count">0</span></button>
  </nav>

  <section class="pane" id="pane-flow" role="tabpanel" aria-labelledby="tab-flow">
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="pane" id="pane-log" role="tabpanel" aria-labelledby="tab-log" hidden>
    <div class="filter" id="filter"></div>
    <ol class="list" id="list"></ol>
  </section>

  <div class="blank" id="blank" hidden></div>
  <div class="offline" id="offline" hidden>和数据服务断开了，正在重连…</div>
</main>
<script src="/static/panel.js"></script>
</body>
</html>
