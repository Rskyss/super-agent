<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超级助手 · 团队</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/team.css">
</head>
<body>
<main class="cfg" aria-label="团队配置">
  <h1>团队</h1>
  <p class="problem" id="problem" hidden></p>

  <div class="thead" aria-hidden="true"><span>角色</span><span>工具</span><span>模型</span><span>思考强度</span><span>状态</span><span></span></div>

  <div class="member" data-role="dispatcher">
    <div class="role">调度员</div>
    <div class="pick">
      <select class="tool-select" aria-label="调度员"></select>
      <input type="text" class="custom" placeholder="启动调度员的命令，例如 qwen" aria-label="自定义调度员命令" hidden>
      <div class="model-box" hidden></div>
    </div>
    <div class="state"><span class="dot"></span><span class="txt">还没检测</span></div>
    <button class="check-one" type="button">检测</button>
  </div>
  <p class="note" id="dispNote"></p>

  <section id="workers">
    <div class="member" data-role="tester">
      <div class="role">写测试</div>
      <div class="pick">
        <select class="tool-select" aria-label="写测试"></select>
        <div class="model-box" hidden></div>
      </div>
      <div class="state"><span class="dot"></span><span class="txt">还没检测</span></div>
      <button class="check-one" type="button">检测</button>
    </div>
    <div class="member" data-role="developer">
      <div class="role">写代码</div>
      <div class="pick">
        <select class="tool-select" aria-label="写代码"></select>
        <div class="model-box" hidden></div>
      </div>
      <div class="state"><span class="dot"></span><span class="txt">还没检测</span></div>
      <button class="check-one" type="button">检测</button>
    </div>
    <div class="member" data-role="reviewer">
      <div class="role">复查</div>
      <div class="pick">
        <select class="tool-select" aria-label="复查"></select>
        <div class="model-box" hidden></div>
      </div>
      <div class="state"><span class="dot"></span><span class="txt">还没检测</span></div>
      <button class="check-one" type="button">检测</button>
    </div>
    <p class="note warn" id="sameWarn" hidden>写代码和复查是同一家：复查就不够独立了（同样的盲区）。</p>
  </section>
  <p class="note warn" id="noGit" hidden>这个文件夹还没有版本管理（git），不能派活；现在只能选一位调度员和它聊天。需要的话，让调度员帮你把版本管理建起来。</p>

  <div class="bar">
    <button class="btn primary" type="button" id="save" disabled>保存并开始</button>
    <span class="summary" id="summary"></span>
  </div>
</main>
<script src="/static/team.js"></script>
</body>
</html>
