<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超级助手 · 对话</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/chat.css">
</head>
<body>
<main class="chat" aria-label="和调度员的对话">
  <header class="chat-head">
    <div id="cardHead" hidden></div>
    <div id="cardInfo" hidden></div>
    <span class="who"><span class="av" id="whoFace">Cx</span><span id="who">Codex</span><span class="conn-dot" id="connDot"></span></span>
    <span class="status" id="status"></span>
    <span class="grow"></span>
    <span class="usage" id="usage"></span>
  </header>

  <div class="msgs" id="msgs" role="log" aria-live="polite"></div>

  <div class="working" id="working" hidden><i></i>正在处理…</div>

  <div class="offline" id="offline" hidden>和数据服务断开了，正在重连…</div>

  <form class="composer" id="composer">
    <div class="composer-box">
      <textarea id="input" rows="1" placeholder="跟调度员说…" aria-label="给调度员的消息"></textarea>
      <button class="btn primary send-btn" type="submit" id="send" aria-label="发送">↑</button>
    </div>
  </form>
</main>
<script src="/static/chat.js"></script>
</body>
</html>
