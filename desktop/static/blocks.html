<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超级助手 · 积木库</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/blocks.css">
</head>
<body>
<p class="problem" id="pageProblem" hidden></p>

<section class="bind-wrap" id="bindWrap" hidden>
  <div class="bind-card" id="bindCard">
    <div class="bind-head">
      <h1 id="bindTitle">先绑定一个大模型，它会当你的行政</h1>
      <button type="button" class="btn ghost" id="bindBack" hidden>返回</button>
    </div>
    <h2 class="bind-sub" id="bindSub" hidden>行政</h2>
    <p class="bind-note">行政要的是<strong>按用量付费的 API 密钥</strong>，ChatGPT 这类会员<strong>订阅</strong>不能直接用。</p>

    <div class="field">
      <label for="bindProvider">服务商</label>
      <select id="bindProvider" aria-label="服务商"></select>
    </div>
    <div class="field">
      <label for="bindModel">模型</label>
      <input type="text" id="bindModel" list="bindModels" placeholder="输入或选择模型名" autocomplete="off" aria-label="模型">
      <datalist id="bindModels"></datalist>
    </div>
    <div class="field" id="bindAddressRow" hidden>
      <label for="bindAddress">服务地址</label>
      <input type="text" id="bindAddress" placeholder="例如 https://api.example.com/v1" autocomplete="off" aria-label="服务地址">
    </div>
    <div class="field">
      <label for="bindKey">API 密钥</label>
      <input type="password" id="bindKey" placeholder="填入 API 密钥" autocomplete="off" aria-label="API 密钥">
      <div class="saved-key" id="bindSaved" hidden><span>已保存的密钥</span><button type="button" id="bindNewKey">换一把</button></div>
    </div>

    <div class="bind-actions">
      <button type="button" class="btn primary" id="bindCheck">检测</button>
      <button type="button" class="btn ghost" id="bindChange" hidden>换一个行政</button>
      <span class="bind-result" id="bindResult"></span>
    </div>
    <div class="settings-health" id="settingsHealth" hidden>
      <h2 class="bind-sub">环境体检</h2>
      <section class="health-card" id="healthCard">
        <div class="health-bar">
          <span class="health-line" id="healthLine"></span>
          <div class="health-actions">
            <button class="btn ghost small" id="healthToggle" type="button">展开</button>
            <button class="btn small" id="healthRecheck" type="button">重新检查</button>
          </div>
        </div>
        <div class="health-rows" id="healthRows" hidden></div>
      </section>
    </div>
  </div>
</section>

<div class="main-layout" id="mainLayout" hidden>
  <aside class="side" id="side" aria-label="对话和基础层">
    <div class="side-section side-chat">
      <div class="sec-head">
        <span>聊天</span>
      </div>
      <button class="newchat" id="newChat" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        <span>新对话</span>
      </button>
      <div class="threads" id="threads"></div>
    </div>
    <div class="side-section side-blocks">
      <div class="sec-head">
        <span>基础层</span>
      </div>
      <div class="blocks-list" id="blocksList"></div>
    </div>
  </aside>

  <main class="stage">
    <header class="topbar">
      <span class="topbar-title">积木库</span>
      <button type="button" class="btn small" id="settingsBtn">设置</button>
    </header>
    <iframe class="chat-frame" id="chatFrame" title="积木库行政对话"></iframe>
    <section class="block-detail" id="blockDetail" hidden>
      <div class="detail-inner">
        <div class="detail-top">
          <button class="btn ghost small" id="detailBack" type="button">← 返回聊天</button>
        </div>
        <h2 id="detailTitle"></h2>
        <div class="detail-status" id="detailStatus"></div>
        <p class="detail-warn" id="detailWarn" hidden></p>
        <div class="detail-rows" id="detailRows"></div>
        <pre class="detail-preview" id="detailPreview" hidden></pre>
        <div class="detail-key-box" id="detailKeyBox" hidden>
          <div class="saved-key" id="detailSaved" hidden><span>已保存的密钥</span><button type="button" id="detailNewKey">换一把</button></div>
          <input id="detailKey" type="password" placeholder="填入 API 密钥" autocomplete="off">
          <small id="detailKeyTip">密钥只填在这里，别贴在聊天里</small>
        </div>
        <div class="detail-actions">
          <button class="btn primary" id="detailCheck" type="button">检测</button>
          <button class="btn" id="detailRemove" type="button">移出基础层</button>
        </div>
        <div class="detail-result" id="detailResult"></div>
        <details class="detail-card" id="detailCard">
          <summary>接法卡全文</summary>
          <pre></pre>
        </details>
      </div>
    </section>
  </main>
</div>

<script src="/static/blocks.js"></script>
</body>
</html>
